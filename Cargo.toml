[workspace]
resolver = "2"
members = [
    "crates/transport-types",
    "crates/transport-world",
    "crates/transport-sim",
    "crates/transport-people",
    "crates/transport-api",
    "crates/transport-orm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
pretty_assertions = "1.0"
proptest = "1.4"
tempfile = "3.0"