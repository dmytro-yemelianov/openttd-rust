name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Cargo clippy
      run: cargo clippy --workspace --locked --all-targets -- -D warnings
    - name: Cargo test
      run: cargo test --workspace --locked
